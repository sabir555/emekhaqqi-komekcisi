<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Səs yaz</title><style>*{box-sizing:border-box}body{font:14px Arial,sans-serif;margin:0;padding:12px;color:#172b4d;background:white}button{background:#1769aa;color:white;border:0;border-radius:8px;padding:10px 12px;margin:3px;cursor:pointer}button:disabled{opacity:.5}#stop{background:#b42318}audio{width:100%;margin:8px 0}#status{color:#475569}#send{background:#15803d}</style></head><body><div><button id="start">🎙 Səs yaz</button><button id="stop" disabled>■ Dayandır</button><button id="send" hidden>➤ Çata göndər</button></div><p id="status">Hazırdır.</p><audio id="preview" controls hidden></audio><script>
const start=document.getElementById('start'),stop=document.getElementById('stop'),send=document.getElementById('send'),status=document.getElementById('status'),preview=document.getElementById('preview');
let rec,stream,parts=[],blob=null,url=null,timer=null;
function cleanup(){if(stream)stream.getTracks().forEach(t=>t.stop());clearInterval(timer)}
start.onclick=async()=>{start.disabled=true;send.hidden=true;preview.hidden=true;status.textContent='Mikrofon icazəsi gözlənilir...';try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Mikrofon bu pəncərədə əlçatan deyil (iframe icazəsi bloklana bilər).');stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(x=>MediaRecorder.isTypeSupported(x))||'';rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);parts=[];rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};rec.onstop=()=>{cleanup();stop.disabled=true;start.disabled=false;blob=new Blob(parts,{type:rec.mimeType});if(!blob.size||blob.size>5*1024*1024){status.textContent='Səs boşdur və ya 5 MB-dan böyükdür.';return;}if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);preview.src=url;preview.hidden=false;send.hidden=false;status.textContent='Dinləyin, sonra göndərin və ya yenidən yazın.'};rec.start();stop.disabled=false;status.textContent='Yazılır...';let secs=0;timer=setInterval(()=>{secs++;status.textContent='Yazılır: '+secs+' saniyə';if(secs>=180&&rec.state==='recording')rec.stop()},1000)}catch(e){cleanup();start.disabled=false;status.textContent='Mikrofon açılmadı: '+(e.message||e.name)}};
stop.onclick=()=>{if(rec?.state==='recording')rec.stop()};
send.onclick=()=>{if(!blob)return;if(window.parent===window){status.textContent='Bu düymə yalnız tətbiqin çatının içində işləyir.';return;}send.disabled=true;status.textContent='Çata ötürülür...';const reader=new FileReader();reader.onload=()=>{window.parent.postMessage({app:'maas-ses',type:'audio',mime:blob.type,base64:String(reader.result).split(',')[1]},'*');status.textContent='Göndərilmə sorğusu ötürüldü. Çatda nəticəni yoxlayın.';send.disabled=false};reader.onerror=()=>{send.disabled=false;status.textContent='Səs oxunmadı.'};reader.readAsDataURL(blob)};
</script></body></html>
